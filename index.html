<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RanbirHQ — Notes, Tools & Music</title>
  <style>
    :root { --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --muted: #94a3b8; --accent: #38bdf8; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 20px; max-width: 800px; margin: auto; line-height: 1.6; }
    header { text-align: center; padding: 25px 0; border-bottom: 1px solid #334155; margin-bottom: 20px; }
    header h1 { font-size: 1.8rem; color: var(--accent); }
    header p { color: var(--muted); font-size: 0.95rem; }
    .tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 20px; }
    .tab-btn { background: var(--card); color: var(--text); border: 1px solid #334155; padding: 8px 16px; border-radius: 20px; cursor: pointer; font-weight: 600; white-space: nowrap; }
    .tab-btn.active { background: var(--accent); color: #0f172a; border-color: var(--accent); }
    .section { display: none; }
    .section.active { display: block; }
    .card { background: var(--card); padding: 16px; border-radius: 12px; margin-bottom: 14px; border: 1px solid #334155; }
    .card h3 { font-size: 1.1rem; margin-bottom: 6px; word-break: break-word; }
    .date { font-size: 0.8rem; color: var(--accent); margin-bottom: 8px; display: block; }
    .btn { display: inline-block; background: var(--accent); color: #0f172a; padding: 7px 14px; border-radius: 8px; text-decoration: none; font-weight: 600; font-size: 0.9rem; margin-top: 10px; }
    audio { width: 100%; margin-top: 10px; height: 40px; }
    .empty { color: var(--muted); text-align: center; padding: 20px; }
  </style>
</head>
<body>

  <header>
    <h1>RanbirHQ</h1>
    <p>डेली नोट्स, लाइव टूल्स, PDF और AI गाने — सब एक जगह</p>
  </header>

  <div class="tabs">
    <button class="tab-btn active" onclick="openTab('notes', this)">📝 डेली नोट्स</button>
    <button class="tab-btn" onclick="openTab('html', this)">⚡ लाइव टूल्स (HTML)</button>
    <button class="tab-btn" onclick="openTab('pdf', this)">📄 PDF फ़ाइलें</button>
    <button class="tab-btn" onclick="openTab('mp3', this)">🎵 MP3 गाने</button>
  </div>

  <div id="notes" class="section active"><div class="empty">नोट्स लोड हो रहे हैं...</div></div>
  <div id="html" class="section"><div class="empty">HTML टूल्स लोड हो रहे हैं...</div></div>
  <div id="pdf" class="section"><div class="empty">PDF फ़ाइलें लोड हो रही हैं...</div></div>
  <div id="mp3" class="section"><div class="empty">MP3 गाने लोड हो रहे हैं...</div></div>

  <script>
    const GITHUB_USER = 'RanbirHQ';
    const REPO_NAME = 'ranbirhq.github.io';

    function openTab(tabId, btn) {
      document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      btn.classList.add('active');
    }

    // 1. डेली नोट्स लोड करना (notes.json से)
    fetch('notes.json?t=' + Date.now())
      .then(res => res.json())
      .then(data => {
        const container = document.getElementById('notes');
        if (!data.length) { container.innerHTML = '<div class="empty">अभी कोई नोट नहीं है।</div>'; return; }
        container.innerHTML = data.map(item => `
          <div class="card">
            <span class="date">${item.date}</span>
            <h3>${item.title}</h3>
            <p>${item.text}</p>
          </div>
        `).join('');
      })
      .catch(() => document.getElementById('notes').innerHTML = '<div class="empty">notes.json फ़ाइल नहीं मिली।</div>');

    // 2. 'files' फ़ोल्डर से अपने आप HTML, PDF और MP3 फ़ाइलें दिखाना
    fetch(`https://api.github.com/repos/${GITHUB_USER}/${REPO_NAME}/contents/files`)
      .then(res => res.json())
      .then(files => {
        let htmlList = '', pdfList = '', mp3List = '';
        files.forEach(file => {
          const name = file.name;
          const cleanName = name.replace(/\.[^/.]+$/, "").replace(/[-_]/g, " ");
          if (name.endsWith('.html')) {
            htmlList += `<div class="card"><h3>${cleanName}</h3><a class="btn" href="files/${name}" target="_blank">लाइव खोलें (Open) ↗</a></div>`;
          } else if (name.endsWith('.pdf')) {
            pdfList += `<div class="card"><h3>${cleanName}</h3><a class="btn" href="files/${name}" target="_blank">PDF देखें / डाउनलोड करें ⬇</a></div>`;
          } else if (name.endsWith('.mp3')) {
            mp3List += `<div class="card"><h3>${cleanName}</h3><audio controls src="files/${name}"></audio><br><a class="btn" href="files/${name}" download>डाउनलोड MP3 ⬇</a></div>`;
          }
        });
        document.getElementById('html').innerHTML = htmlList || '<div class="empty">अभी कोई HTML फ़ाइल नहीं है।</div>';
        document.getElementById('pdf').innerHTML = pdfList || '<div class="empty">अभी कोई PDF फ़ाइल नहीं है।</div>';
        document.getElementById('mp3').innerHTML = mp3List || '<div class="empty">अभी कोई MP3 गाना नहीं है।</div>';
      })
      .catch(() => console.log('GitHub API से फ़ाइलें लोड नहीं हो सकीं।'));
  </script>
</body>
</html>
