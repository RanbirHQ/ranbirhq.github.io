<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ranbir - Notes, Tools, PDF & MP3</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f4f6f9;
      color: #1e293b;
      line-height: 1.6;
    }
    header {
      background: #1e3a8a;
      color: #ffffff;
      padding: 18px 16px;
      text-align: center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.12);
    }
    header h1 {
      font-size: 1.5rem;
      letter-spacing: 0.5px;
    }
    .tabs {
      display: flex;
      background: #ffffff;
      border-bottom: 1px solid #cbd5e1;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .tab-btn {
      flex: 1;
      padding: 13px 6px;
      border: none;
      background: none;
      font-size: 0.92rem;
      font-weight: 600;
      color: #64748b;
      cursor: pointer;
      border-bottom: 3px solid transparent;
      transition: all 0.2s;
    }
    .tab-btn.active {
      color: #1e3a8a;
      border-bottom-color: #1e3a8a;
      background: #eff6ff;
    }
    .container {
      max-width: 820px;
      margin: 16px auto;
      padding: 0 12px 40px;
    }
    .section { display: none; }
    .section.active { display: block; }
    .card {
      background: #ffffff;
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.07);
      border: 1px solid #e2e8f0;
    }
    .card-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 8px;
      word-break: break-word;
    }
    .note-text {
      white-space: pre-wrap;
      font-size: 0.95rem;
      color: #334155;
      background: #f8fafc;
      padding: 12px;
      border-radius: 6px;
      border-left: 3px solid #3b82f6;
      word-break: break-word;
    }
    .note-text a {
      color: #2563eb;
      text-decoration: underline;
      font-weight: 600;
    }
    .btn-row {
      display: flex;
      gap: 10px;
      margin-top: 10px;
      flex-wrap: wrap;
    }
    .btn {
      display: inline-block;
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 0.88rem;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      border: none;
    }
    .btn-primary {
      background: #2563eb;
      color: #ffffff;
    }
    .btn-secondary {
      background: #e2e8f0;
      color: #1e293b;
    }
    audio {
      width: 100%;
      margin-top: 8px;
      height: 40px;
    }
    .status-msg {
      text-align: center;
      padding: 30px 12px;
      color: #64748b;
      font-size: 0.95rem;
    }
    #toolViewer {
      display: none;
      position: fixed;
      inset: 0;
      background: #ffffff;
      z-index: 100;
      flex-direction: column;
    }
    #toolViewerHeader {
      background: #1e3a8a;
      color: #fff;
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    #toolFrame {
      flex: 1;
      width: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <header>
    <h1>Ranbir</h1>
  </header>

  <nav class="tabs">
    <button class="tab-btn active" onclick="switchTab('notes', this)">Notes</button>
    <button class="tab-btn" onclick="switchTab('tools', this)">Tools</button>
    <button class="tab-btn" onclick="switchTab('pdfs', this)">PDF</button>
    <button class="tab-btn" onclick="switchTab('mp3s', this)">MP3</button>
  </nav>

  <div class="container">
    <div id="notes" class="section active"><div class="status-msg">लोड हो रहा है...</div></div>
    <div id="tools" class="section"><div class="status-msg">लोड हो रहा है...</div></div>
    <div id="pdfs" class="section"><div class="status-msg">लोड हो रहा है...</div></div>
    <div id="mp3s" class="section"><div class="status-msg">लोड हो रहा है...</div></div>
  </div>

  <div id="toolViewer">
    <div id="toolViewerHeader">
      <span id="toolViewerTitle" style="font-weight:600;font-size:0.95rem;">Tool</span>
      <button class="btn btn-secondary" onclick="closeTool()">✕ बंद करें</button>
    </div>
    <iframe id="toolFrame"></iframe>
  </div>

  <script>
    const USERNAME = "RanbirHQ";
    const REPO = "ranbirhq.github.io";
    const FOLDER = "files";

    function switchTab(tabId, btn) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById(tabId).classList.add('active');
    }

    function cleanName(filename) {
      return filename.replace(/\.[^/.]+$/, "").replace(/[-_]/g, " ");
    }

    function linkifyText(text) {
      const escaped = text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
      return escaped.replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>');
    }

    async function openTool(url, title) {
      document.getElementById('toolViewerTitle').textContent = title;
      document.getElementById('toolViewer').style.display = 'flex';
      const frame = document.getElementById('toolFrame');
      frame.srcdoc = "<p style='font-family:sans-serif;padding:20px;'>लोड हो रहा है...</p>";
      try {
        const res = await fetch(url);
        const html = await res.text();
        frame.srcdoc = html;
      } catch (e) {
        frame.srcdoc = "<p style='font-family:sans-serif;padding:20px;color:red;'>टूल लोड करने में समस्या आई।</p>";
      }
    }

    function closeTool() {
      document.getElementById('toolViewer').style.display = 'none';
      document.getElementById('toolFrame').srcdoc = "";
    }

    async function loadFiles() {
      const apiUrl = `https://api.github.com/repos/${USERNAME}/${REPO}/contents/${FOLDER}`;
      try {
        const res = await fetch(apiUrl);
        if (!res.ok) throw new Error("फ़ोल्डर नहीं मिला");
        const items = await res.json();

        const notesEl = document.getElementById('notes');
        const toolsEl = document.getElementById('tools');
        const pdfsEl  = document.getElementById('pdfs');
        const mp3sEl  = document.getElementById('mp3s');

        notesEl.innerHTML = "";
        toolsEl.innerHTML = "";
        pdfsEl.innerHTML  = "";
        mp3sEl.innerHTML  = "";

        let count = { notes: 0, tools: 0, pdfs: 0, mp3s: 0 };

        for (const item of items) {
          if (item.type !== "file") continue;
          const name = item.name;
          const lower = name.toLowerCase();
          const title = cleanName(name);
          const rawUrl = item.download_url;

          if (lower.endsWith(".txt")) {
            count.notes++;
            const card = document.createElement("div");
            card.className = "card";
            card.innerHTML = `<div class="card-title">${title}</div><div class="note-text">नोट लोड हो रहा है...</div>`;
            notesEl.appendChild(card);

            fetch(rawUrl).then(r => r.text()).then(txt => {
              card.querySelector(".note-text").innerHTML = linkifyText(txt);
            });
          } 
          else if (lower.endsWith(".html") || lower.endsWith(".htm")) {
            count.tools++;
            const card = document.createElement("div");
            card.className = "card";
            card.innerHTML = `
              <div class="card-title">${title}</div>
              <div class="btn-row">
                <button class="btn btn-primary" onclick="openTool('${rawUrl}', '${title.replace(/'/g, "\'")}')">▶ टूल खोलें</button>
              </div>`;
            toolsEl.appendChild(card);
          } 
          else if (lower.endsWith(".pdf")) {
            count.pdfs++;
            const viewerUrl = `https://docs.google.com/gview?embedded=true&url=${encodeURIComponent(rawUrl)}`;
            const card = document.createElement("div");
            card.className = "card";
            card.innerHTML = `
              <div class="card-title">${title}</div>
              <div class="btn-row">
                <a class="btn btn-primary" href="${viewerUrl}" target="_blank">📄 PDF पढ़ें</a>
                <a class="btn btn-secondary" href="${rawUrl}" download>⬇ डाउनलोड</a>
              </div>`;
            pdfsEl.appendChild(card);
          } 
          else if (lower.endsWith(".mp3") || lower.endsWith(".m4a") || lower.endsWith(".wav")) {
            count.mp3s++;
            const card = document.createElement("div");
            card.className = "card";
            card.innerHTML = `
              <div class="card-title">🎵 ${title}</div>
              <audio controls preload="none" src="${rawUrl}"></audio>
              <div class="btn-row">
                <a class="btn btn-secondary" href="${rawUrl}" download>⬇ MP3 डाउनलोड</a>
              </div>`;
            mp3sEl.appendChild(card);
          }
        }

        if (!count.notes) notesEl.innerHTML = '<div class="status-msg">अभी कोई नोट उपलब्ध नहीं है।</div>';
        if (!count.tools) toolsEl.innerHTML = '<div class="status-msg">अभी कोई HTML टूल उपलब्ध नहीं है।</div>';
        if (!count.pdfs)  pdfsEl.innerHTML  = '<div class="status-msg">अभी कोई PDF उपलब्ध नहीं है।</div>';
        if (!count.mp3s)  mp3sEl.innerHTML  = '<div class="status-msg">अभी कोई MP3 उपलब्ध नहीं है।</div>';

      } catch (err) {
        document.querySelectorAll('.section').forEach(s => {
          s.innerHTML = '<div class="status-msg">फ़ाइलें लोड नहीं हो सकीं। कृपया सुनिश्चित करें कि GitHub में <b>files</b> फ़ोल्डर बना हुआ है।</div>';
        });
      }
    }

    loadFiles();
  </script>
</body>
</html>
